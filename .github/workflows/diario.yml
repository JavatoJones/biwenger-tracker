name: Actualización de datos

on:
  schedule:
    # Cada dos horas de 05:47 a 23:47 UTC. GitHub retrasa los cron programados a veces
    # varias horas, así que una sola ejecución diaria dejaba el saldo del día anterior hasta
    # la tarde. Si nada ha cambiado no se hace commit. El minuto 47 evita las horas en punto,
    # que es cuando más se retrasan.
    - cron: "47 5-23/2 * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar datos y generar la web
        env:
          BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
        run: |
          python -m scraper.daily
          python -m scraper.dashboard

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Datos del $(date +%F)"
          git push
